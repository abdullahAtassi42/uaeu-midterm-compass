<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Midterm Compass</title><link rel="stylesheet" href="../ui.css"><link rel="stylesheet" href="popup.css"></head>
<body><main>
  <header><div class="brand"><span class="brand-mark">✓</span><span>Midterm Compass</span></div><button id="settings" class="ghost" aria-label="Settings">⚙</button></header>
  <section class="hero"><p class="eyebrow">BLACKBOARD SCANNER</p><h1 id="count">Your midterm map</h1><p id="summary" class="muted">Open Blackboard Messages, then scan the page.</p><div class="scan-actions"><button id="scanAll" class="primary">Scan current courses</button><button id="scan" class="hero-link">Scan this page only</button></div><p id="status" class="status" role="status"></p></section>
  <section><div class="section-title"><h2>Next up</h2><span id="lastScan" class="muted"></span></div><div id="events"></div></section>
  <footer><button id="schedule" class="secondary">Open full schedule</button><button id="export" class="ghost">Export .ics</button></footer>
</main><script src="popup.js"></script></body></html>
