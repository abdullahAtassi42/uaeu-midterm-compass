<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Midterm Compass Settings</title><link rel="stylesheet" href="../ui.css"><link rel="stylesheet" href="options.css"></head><body><main><div class="brand"><span class="brand-mark">✓</span><span>Midterm Compass</span></div><h1>Settings</h1><p class="muted">Choose how message text is interpreted. Local mode never sends Blackboard content outside your browser.</p>
<form id="form"><section><h2>Extraction mode</h2><label class="choice"><input type="radio" name="aiMode" value="browser"><span><strong>Private browser mode</strong><small>Uses reliable date rules locally. Designed to use browser AI when supported in a future Chrome release.</small></span></label><label class="choice"><input type="radio" name="aiMode" value="api"><span><strong>OpenAI-compatible API</strong><small>Sends scanned Blackboard excerpts to your configured endpoint. Off by default.</small></span></label></section><section id="apiFields"><div class="warning">Privacy note: API mode transmits message excerpts—which may include course or instructor information—to the configured provider.</div><label>Endpoint<input id="apiEndpoint" type="url" placeholder="https://api.openai.com/v1"></label><label>Model<input id="apiModel" placeholder="gpt-4o-mini"></label><label>API key<input id="apiKey" type="password" autocomplete="off" placeholder="Stored only in Chrome local storage"></label></section><section><h2>Reminders</h2><label>Notify me before each midterm<select id="reminders"><option value="7,1">7 days and 1 day</option><option value="3,1">3 days and 1 day</option><option value="1">1 day</option><option value="">Never</option></select></label></section><button class="primary" type="submit">Save settings</button><span id="status" class="status" role="status"></span></form></main><script src="options.js"></script></body></html>
